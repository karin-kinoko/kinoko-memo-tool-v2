<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備考欄整形ツール - AI自動整形</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --navy: #1B2838;
  --navy-light: #2a3f54;
  --navy-dark: #111c27;
  --gold: #C9A96E;
  --gold-light: #e0c78f;
  --gold-dark: #a8893e;
  --bg: #f5f5f0;
  --white: #ffffff;
  --text: #333333;
  --text-light: #666666;
  --border: #e0ddd5;
  --success: #4caf50;
  --error: #e53935;
}

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* Header */
.header {
  background: var(--navy);
  color: var(--white);
  padding: 1.2rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

.header-left {
  display: flex;
  align-items: baseline;
  gap: 1rem;
}

.header h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.header .subtitle {
  font-size: 0.8rem;
  color: var(--gold);
  font-weight: 400;
}

.settings-btn {
  background: none;
  border: 1.5px solid var(--gold);
  color: var(--gold);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.settings-btn:hover {
  background: var(--gold);
  color: var(--navy);
}

.settings-btn svg {
  width: 18px;
  height: 18px;
}

/* Main Container */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}

/* Input Section */
.section {
  background: var(--white);
  border-radius: 12px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  border: 1px solid var(--border);
}

.section-label {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-light);
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.section-label .icon {
  color: var(--gold);
}

textarea {
  width: 100%;
  min-height: 240px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.9rem;
  line-height: 1.7;
  resize: vertical;
  transition: border-color 0.2s;
  background: #fafaf8;
}

textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
}

textarea::placeholder {
  color: #aaa;
}

/* Drop Zone */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 0.75rem;
  background: #fafaf8;
}

.drop-zone:hover,
.drop-zone.dragover {
  border-color: var(--gold);
  background: rgba(201, 169, 110, 0.05);
}

.drop-zone-text {
  font-size: 0.85rem;
  color: var(--text-light);
}

.drop-zone-text .highlight {
  color: var(--gold-dark);
  font-weight: 500;
}

.drop-zone input[type="file"] {
  display: none;
}

/* Format Button */
.action-row {
  text-align: center;
  margin: 1.5rem 0;
}

.format-btn {
  background: var(--navy);
  color: var(--white);
  border: none;
  padding: 0.9rem 3rem;
  font-size: 1rem;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Sans JP', sans-serif;
  letter-spacing: 0.05em;
  position: relative;
  overflow: hidden;
}

.format-btn:hover:not(:disabled) {
  background: var(--navy-light);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(27, 40, 56, 0.3);
}

.format-btn:active:not(:disabled) {
  transform: translateY(0);
}

.format-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.format-btn .btn-text {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

/* Spinner */
.spinner {
  display: none;
  width: 20px;
  height: 20px;
  border: 2.5px solid rgba(255,255,255,0.3);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.format-btn.loading .spinner {
  display: inline-block;
}

.format-btn.loading .btn-label {
  display: none;
}

/* Output Section */
.output-section {
  display: none;
}

.output-section.visible {
  display: block;
}

.output-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}

.output-box {
  background: #fafaf8;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 1.25rem;
  font-size: 0.85rem;
  line-height: 1.8;
  white-space: pre-wrap;
  font-family: 'Noto Sans JP', monospace;
  max-height: 600px;
  overflow-y: auto;
}

.copy-btn {
  background: var(--gold);
  color: var(--navy);
  border: none;
  padding: 0.5rem 1.2rem;
  font-size: 0.8rem;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.copy-btn:hover {
  background: var(--gold-light);
}

.copy-btn.copied {
  background: var(--success);
  color: white;
}

/* Note */
.note {
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-light);
  margin-top: 1.5rem;
  padding: 0.75rem;
  background: rgba(201, 169, 110, 0.08);
  border-radius: 6px;
}

/* Error */
.error-msg {
  display: none;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--error);
  padding: 0.75rem 1rem;
  border-radius: 8px;
  font-size: 0.85rem;
  margin-bottom: 1rem;
}

.error-msg.visible {
  display: block;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.modal-overlay.visible {
  display: flex;
}

.modal {
  background: var(--white);
  border-radius: 16px;
  padding: 2rem;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.modal h2 {
  font-size: 1.2rem;
  margin-bottom: 0.5rem;
  color: var(--navy);
}

.modal p {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 1.25rem;
  line-height: 1.6;
}

.modal input {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 0.9rem;
  font-family: monospace;
  margin-bottom: 1rem;
  transition: border-color 0.2s;
}

.modal input:focus {
  outline: none;
  border-color: var(--gold);
}

.modal-actions {
  display: flex;
  gap: 0.75rem;
  justify-content: flex-end;
}

.modal-btn {
  padding: 0.6rem 1.5rem;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  transition: all 0.2s;
}

.modal-btn.primary {
  background: var(--navy);
  color: var(--white);
  border: none;
}

.modal-btn.primary:hover {
  background: var(--navy-light);
}

.modal-btn.secondary {
  background: none;
  border: 1.5px solid var(--border);
  color: var(--text-light);
}

.modal-btn.secondary:hover {
  border-color: var(--text-light);
}

.modal-btn.danger {
  background: none;
  border: 1.5px solid var(--error);
  color: var(--error);
}

.modal-btn.danger:hover {
  background: var(--error);
  color: white;
}

/* Status indicator */
.api-status {
  font-size: 0.7rem;
  color: var(--gold);
  opacity: 0.8;
  margin-top: 0.25rem;
}

.api-status.connected::before {
  content: '●';
  margin-right: 0.3rem;
  color: var(--success);
}

.api-status.disconnected::before {
  content: '●';
  margin-right: 0.3rem;
  color: var(--error);
}

/* Responsive */
@media (max-width: 640px) {
  .header {
    padding: 1rem 1.2rem;
  }
  .header h1 {
    font-size: 1.1rem;
  }
  .container {
    padding: 1.2rem 1rem;
  }
  .section {
    padding: 1.2rem;
  }
  textarea {
    min-height: 180px;
  }
  .format-btn {
    width: 100%;
    padding: 1rem;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div>
      <h1>備考欄整形ツール</h1>
      <div class="api-status" id="apiStatus"></div>
    </div>
    <span class="subtitle">AI自動整形 - 木の子交通</span>
  </div>
  <button class="settings-btn" onclick="openSettings()" title="API設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
</header>

<!-- Main Content -->
<main class="container">
  <!-- Error Message -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Input Section -->
  <div class="section">
    <div class="section-label">
      <span class="icon">▎</span>
      メール内容を貼り付け
    </div>
    <textarea id="inputText" placeholder="ここにメール本文やチャット内容を貼り付けてください...&#10;&#10;例：予約確認メール、行程変更の連絡、ガイド情報のやり取りなど"></textarea>
    
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-text">
        📄 PDFファイルを<span class="highlight">ドラッグ＆ドロップ</span>、またはクリックして選択
      </div>
      <input type="file" id="fileInput" accept=".pdf">
    </div>
  </div>

  <!-- Action Button -->
  <div class="action-row">
    <button class="format-btn" id="formatBtn" onclick="formatText()">
      <span class="btn-text">
        <span class="btn-label">整形する</span>
        <span class="spinner"></span>
      </span>
    </button>
  </div>

  <!-- Output Section -->
  <div class="section output-section" id="outputSection">
    <div class="output-header">
      <div class="section-label" style="margin-bottom:0">
        <span class="icon">▎</span>
        整形結果
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyOutput()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        コピー
      </button>
    </div>
    <div class="output-box" id="outputBox"></div>
  </div>

  <!-- Note -->
  <div class="note">
    ※AIによる自動整形のため、最終確認をお願いします
  </div>
</main>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>🔑 API設定</h2>
    <p>OpenAI APIキーを入力してください。キーはブラウザ内（localStorage）にのみ保存され、OpenAI以外には送信されません。</p>
    <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
    <div class="modal-actions">
      <button class="modal-btn danger" id="deleteKeyBtn" onclick="deleteKey()" style="display:none">削除</button>
      <button class="modal-btn secondary" id="cancelBtn" onclick="closeSettings()">キャンセル</button>
      <button class="modal-btn primary" onclick="saveKey()">保存</button>
    </div>
  </div>
</div>

<!-- Initial Setup Modal -->
<div class="modal-overlay" id="setupModal">
  <div class="modal">
    <h2>はじめに</h2>
    <p>このツールはOpenAI APIを使用してメール内容を自動整形します。<br>ご利用にはAPIキーが必要です。キーはお使いのブラウザ内にのみ保存されます。</p>
    <input type="password" id="setupKeyInput" placeholder="sk-...">
    <div class="modal-actions">
      <button class="modal-btn primary" onclick="saveSetupKey()">設定して開始</button>
    </div>
  </div>
</div>

<script>
// PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const STORAGE_KEY = 'kinoko_openai_key';
const SYSTEM_PROMPT = `あなたは木の子交通株式会社の配車管理システム用の備考欄整形アシスタントです。
以下のメール・やり取り内容から、配車指示書の備考欄に記載する情報を抽出し、以下のフォーマットで整形してください。

【出力フォーマット】
＜見積もり条件＞
・利用可能時間：{利用可能時間}
・走行距離：{走行距離km以内/回送込}
___________________________________________
【運行日】{年月日（曜日）}
【人数】{合計人数} ({お客様X名 + ガイドX名})
【乗車地】{場所} / ピックアップ {時間} ＊{プラン種別}
行程内容: {行程}
【下車地】{場所} / 到着予定 {時間}
【エスコート】{要/不要。詳細あれば記載}

ガイド：{ガイド名}
　　　　連絡先：{電話番号}
___________________________________________
〈共通情報〉
お客様名：{お客様名}様

連絡先：
【弊社コード】{予約コード}
【緊急連絡先】{電話番号} {備考}
___________________________________________
{スケジュール一覧: 日付 内容 担当者}
___________________________________________
初回受付：{担当者名}（{日付}）
最終確認：{担当者名}（{日付}）

【ルール】
- 情報が見つからない項目は「未定」と記載
- 複数日程の予約がある場合は、日程ごとに整形
- メール内の最新情報を優先（変更・キャンセルがあれば反映）
- 日本語で出力
- フォーマット通りの罫線（___）を使用`;

// State
let isProcessing = false;

// Init
document.addEventListener('DOMContentLoaded', () => {
  updateApiStatus();
  if (!getApiKey()) {
    document.getElementById('setupModal').classList.add('visible');
  }
  setupDropZone();
});

// API Key Management
function getApiKey() {
  return localStorage.getItem(STORAGE_KEY);
}

function updateApiStatus() {
  const el = document.getElementById('apiStatus');
  if (getApiKey()) {
    el.textContent = 'APIキー設定済み';
    el.className = 'api-status connected';
  } else {
    el.textContent = 'APIキー未設定';
    el.className = 'api-status disconnected';
  }
}

function openSettings() {
  const modal = document.getElementById('settingsModal');
  const input = document.getElementById('apiKeyInput');
  const deleteBtn = document.getElementById('deleteKeyBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  
  input.value = getApiKey() || '';
  deleteBtn.style.display = getApiKey() ? 'inline-block' : 'none';
  cancelBtn.style.display = 'inline-block';
  modal.classList.add('visible');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('visible');
}

function saveKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    showError('APIキーを入力してください');
    return;
  }
  localStorage.setItem(STORAGE_KEY, key);
  updateApiStatus();
  closeSettings();
}

function deleteKey() {
  if (confirm('APIキーを削除しますか？')) {
    localStorage.removeItem(STORAGE_KEY);
    updateApiStatus();
    closeSettings();
  }
}

function saveSetupKey() {
  const key = document.getElementById('setupKeyInput').value.trim();
  if (!key) {
    showError('APIキーを入力してください');
    return;
  }
  localStorage.setItem(STORAGE_KEY, key);
  updateApiStatus();
  document.getElementById('setupModal').classList.remove('visible');
}

// PDF Drop Zone
function setupDropZone() {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') {
      extractPdfText(file);
    } else {
      showError('PDFファイルのみ対応しています');
    }
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      extractPdfText(file);
    }
  });
}

async function extractPdfText(file) {
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = '';
    
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(' ');
      text += pageText + '\n';
    }
    
    const textarea = document.getElementById('inputText');
    textarea.value = text.trim();
    textarea.focus();
  } catch (err) {
    showError('PDFの読み取りに失敗しました: ' + err.message);
  }
}

// Format with OpenAI
async function formatText() {
  if (isProcessing) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    openSettings();
    return;
  }

  const inputText = document.getElementById('inputText').value.trim();
  if (!inputText) {
    showError('テキストを入力してください');
    return;
  }

  hideError();
  setLoading(true);

  try {
    const response = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        temperature: 0.1,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user', content: inputText }
        ]
      })
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      if (response.status === 401) {
        throw new Error('APIキーが無効です。設定を確認してください。');
      } else if (response.status === 429) {
        throw new Error('APIレート制限に達しました。少し待ってから再試行してください。');
      } else {
        throw new Error(errData.error?.message || `APIエラー (${response.status})`);
      }
    }

    const data = await response.json();
    const result = data.choices[0]?.message?.content;

    if (!result) {
      throw new Error('AIからの応答が空でした');
    }

    showOutput(result);
  } catch (err) {
    showError(err.message);
  } finally {
    setLoading(false);
  }
}

// UI Helpers
function setLoading(loading) {
  isProcessing = loading;
  const btn = document.getElementById('formatBtn');
  btn.disabled = loading;
  btn.classList.toggle('loading', loading);
}

function showOutput(text) {
  const section = document.getElementById('outputSection');
  const box = document.getElementById('outputBox');
  box.textContent = text;
  section.classList.add('visible');
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyOutput() {
  const box = document.getElementById('outputBox');
  const btn = document.getElementById('copyBtn');
  
  navigator.clipboard.writeText(box.textContent).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> コピー完了`;
    
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> コピー`;
    }, 2000);
  });
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('visible');
}
</script>
</body>
</html>
