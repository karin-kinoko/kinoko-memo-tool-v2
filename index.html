<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備考欄整形ツール v3 - テキスト＋Excel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --navy: #1B2838;
  --navy-light: #2a3f54;
  --navy-dark: #111c27;
  --gold: #C9A96E;
  --gold-light: #e0c78f;
  --gold-dark: #a8893e;
  --bg: #f5f5f0;
  --white: #ffffff;
  --text: #333333;
  --text-light: #666666;
  --border: #e0ddd5;
  --success: #4caf50;
  --error: #e53935;
}

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* Header */
.header {
  background: var(--navy);
  color: var(--white);
  padding: 1.2rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

.header-left {
  display: flex;
  align-items: baseline;
  gap: 1rem;
}

.header h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.header .subtitle {
  font-size: 0.8rem;
  color: var(--gold);
  font-weight: 400;
}

.settings-btn {
  background: none;
  border: 1.5px solid var(--gold);
  color: var(--gold);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.settings-btn:hover {
  background: var(--gold);
  color: var(--navy);
}

.settings-btn svg {
  width: 18px;
  height: 18px;
}

/* Main Container */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}

/* Input Section */
.section {
  background: var(--white);
  border-radius: 12px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  border: 1px solid var(--border);
}

.section-label {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-light);
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.section-label .icon {
  color: var(--gold);
}

textarea {
  width: 100%;
  min-height: 240px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.9rem;
  line-height: 1.7;
  resize: vertical;
  transition: border-color 0.2s;
  background: #fafaf8;
}

textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
}

textarea::placeholder {
  color: #aaa;
}

/* Drop Zone */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 0.75rem;
  background: #fafaf8;
}

.drop-zone:hover,
.drop-zone.dragover {
  border-color: var(--gold);
  background: rgba(201, 169, 110, 0.05);
}

.drop-zone-text {
  font-size: 0.85rem;
  color: var(--text-light);
}

.drop-zone-text .highlight {
  color: var(--gold-dark);
  font-weight: 500;
}

.drop-zone input[type="file"] {
  display: none;
}

/* Action Buttons */
.action-row {
  display: flex;
  gap: 1rem;
  justify-content: center;
  margin: 1.5rem 0;
}

.action-btn {
  border: none;
  padding: 0.9rem 2rem;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Sans JP', sans-serif;
  letter-spacing: 0.03em;
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.action-btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.action-btn:active:not(:disabled) {
  transform: translateY(0);
}

.action-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-text-gen {
  background: var(--gold);
  color: var(--navy);
}

.btn-text-gen:hover:not(:disabled) {
  background: var(--gold-light);
  box-shadow: 0 4px 12px rgba(201, 169, 110, 0.4);
}

.btn-excel {
  background: var(--navy);
  color: var(--white);
}

.btn-excel:hover:not(:disabled) {
  background: var(--navy-light);
  box-shadow: 0 4px 12px rgba(27, 40, 56, 0.3);
}

/* Spinner */
.spinner {
  display: none;
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255,255,255,0.3);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.action-btn.loading .spinner {
  display: inline-block;
}

.action-btn.loading .btn-label {
  display: none;
}

/* Output Section */
.output-section {
  display: none;
}

.output-section.visible {
  display: block;
}

.output-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}

.output-box {
  background: #fafaf8;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 1.25rem;
  font-size: 0.85rem;
  line-height: 1.8;
  white-space: pre-wrap;
  font-family: 'Noto Sans JP', monospace;
  max-height: 600px;
  overflow-y: auto;
}

.output-actions {
  display: flex;
  gap: 0.5rem;
}

.copy-btn, .download-btn {
  background: var(--gold);
  color: var(--navy);
  border: none;
  padding: 0.5rem 1.2rem;
  font-size: 0.8rem;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.copy-btn:hover, .download-btn:hover {
  background: var(--gold-light);
}

.copy-btn.copied {
  background: var(--success);
  color: white;
}

.download-btn {
  background: var(--navy);
  color: var(--white);
}

.download-btn:hover {
  background: var(--navy-light);
}

/* Note */
.note {
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-light);
  margin-top: 1.5rem;
  padding: 0.75rem;
  background: rgba(201, 169, 110, 0.08);
  border-radius: 6px;
}

/* Error */
.error-msg {
  display: none;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--error);
  padding: 0.75rem 1rem;
  border-radius: 8px;
  font-size: 0.85rem;
  margin-bottom: 1rem;
}

.error-msg.visible {
  display: block;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.modal-overlay.visible {
  display: flex;
}

.modal {
  background: var(--white);
  border-radius: 16px;
  padding: 2rem;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.modal h2 {
  font-size: 1.2rem;
  margin-bottom: 0.5rem;
  color: var(--navy);
}

.modal p {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 1.25rem;
  line-height: 1.6;
}

.modal input {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 0.9rem;
  font-family: monospace;
  margin-bottom: 1rem;
  transition: border-color 0.2s;
}

.modal input:focus {
  outline: none;
  border-color: var(--gold);
}

.modal-actions {
  display: flex;
  gap: 0.75rem;
  justify-content: flex-end;
}

.modal-btn {
  padding: 0.6rem 1.5rem;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  transition: all 0.2s;
}

.modal-btn.primary {
  background: var(--navy);
  color: var(--white);
  border: none;
}

.modal-btn.primary:hover {
  background: var(--navy-light);
}

.modal-btn.secondary {
  background: none;
  border: 1.5px solid var(--border);
  color: var(--text-light);
}

.modal-btn.secondary:hover {
  border-color: var(--text-light);
}

.modal-btn.danger {
  background: none;
  border: 1.5px solid var(--error);
  color: var(--error);
}

.modal-btn.danger:hover {
  background: var(--error);
  color: white;
}

/* Status indicator */
.api-status {
  font-size: 0.7rem;
  color: var(--gold);
  opacity: 0.8;
  margin-top: 0.25rem;
}

.api-status.connected::before {
  content: '●';
  margin-right: 0.3rem;
  color: var(--success);
}

.api-status.disconnected::before {
  content: '●';
  margin-right: 0.3rem;
  color: var(--error);
}

/* Responsive */
@media (max-width: 640px) {
  .header {
    padding: 1rem 1.2rem;
  }
  .header h1 {
    font-size: 1.1rem;
  }
  .header .subtitle {
    font-size: 0.7rem;
  }
  .container {
    padding: 1.2rem 1rem;
  }
  .section {
    padding: 1.2rem;
  }
  textarea {
    min-height: 180px;
  }
  .action-row {
    flex-direction: column;
  }
  .action-btn {
    width: 100%;
    justify-content: center;
    padding: 1rem;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div>
      <h1>備考欄整形ツール v3</h1>
      <div class="api-status" id="apiStatus"></div>
    </div>
    <span class="subtitle">AI自動整形 - 木の子交通</span>
  </div>
  <button class="settings-btn" onclick="openSettings()" title="API設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
</header>

<!-- Main Content -->
<main class="container">
  <!-- Error Message -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Input Section -->
  <div class="section">
    <div class="section-label">
      <span class="icon">▎</span>
      メール内容を貼り付け
    </div>
    <textarea id="inputText" placeholder="ここにメール本文やチャット内容を貼り付けてください...&#10;&#10;例：予約確認メール、行程変更の連絡、ガイド情報のやり取りなど"></textarea>
    
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-text">
        📄 PDFファイルを<span class="highlight">ドラッグ＆ドロップ</span>、またはクリックして選択
      </div>
      <input type="file" id="fileInput" accept=".pdf">
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="action-row">
    <button class="action-btn btn-text-gen" id="textGenBtn" onclick="generateText()">
      <span class="btn-label">📋 備考欄テキスト生成</span>
      <span class="spinner"></span>
    </button>
    <button class="action-btn btn-excel" id="excelBtn" onclick="generateExcel()">
      <span class="btn-label">📊 Excel出力</span>
      <span class="spinner"></span>
    </button>
  </div>

  <!-- Text Output Section -->
  <div class="section output-section" id="textOutputSection">
    <div class="output-header">
      <div class="section-label" style="margin-bottom:0">
        <span class="icon">▎</span>
        備考欄テキスト
      </div>
      <div class="output-actions">
        <button class="copy-btn" id="copyBtn" onclick="copyOutput()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          コピー
        </button>
      </div>
    </div>
    <div class="output-box" id="textOutputBox"></div>
  </div>

  <!-- Excel Output Section -->
  <div class="section output-section" id="excelOutputSection">
    <div class="output-header">
      <div class="section-label" style="margin-bottom:0">
        <span class="icon">▎</span>
        Excel出力結果
      </div>
      <div class="output-actions">
        <button class="download-btn" id="downloadBtn" onclick="downloadExcel()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          ダウンロード
        </button>
      </div>
    </div>
    <div class="output-box" id="excelOutputBox"></div>
  </div>

  <!-- Note -->
  <div class="note">
    ※AIによる自動整形のため、最終確認をお願いします
  </div>
</main>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>🔑 API設定</h2>
    <p>OpenAI APIキーを入力してください。キーはブラウザ内（localStorage）にのみ保存され、OpenAI以外には送信されません。</p>
    <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
    <div class="modal-actions">
      <button class="modal-btn danger" id="deleteKeyBtn" onclick="deleteKey()" style="display:none">削除</button>
      <button class="modal-btn secondary" id="cancelBtn" onclick="closeSettings()">キャンセル</button>
      <button class="modal-btn primary" onclick="saveKey()">保存</button>
    </div>
  </div>
</div>

<!-- Initial Setup Modal -->
<div class="modal-overlay" id="setupModal">
  <div class="modal">
    <h2>はじめに</h2>
    <p>このツールはOpenAI APIを使用してメール内容を自動整形します。<br>ご利用にはAPIキーが必要です。キーはお使いのブラウザ内にのみ保存されます。</p>
    <input type="password" id="setupKeyInput" placeholder="sk-...">
    <div class="modal-actions">
      <button class="modal-btn primary" onclick="saveSetupKey()">設定して開始</button>
    </div>
  </div>
</div>

<script>
// PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const STORAGE_KEY = 'kinoko_openai_key';

// System prompt for text generation (NEW format)
const TEXT_SYSTEM_PROMPT = `あなたは木の子交通株式会社の配車管理システム用の備考欄整形アシスタントです。
以下のメール・やり取り内容から、配車指示書の備考欄に記載する情報を抽出し、以下のフォーマットで整形してください。

【出力フォーマット】
___________________________________________


【ご予約内容】

木の子交通管理番号：{管理番号があれば記載、なければ「未定」}

===========================================
〈予約①〉
【運行日】{年月日（曜日）}
【人数】{人数} ({お客様X名 + ガイド/アシスタントX名})
【乗車地】{場所}（{便名等あれば記載}）
【下車地】{場所}
【エスコート】{要/不要。詳細あれば記載}
【ミートサービス】{要/不要。詳細あれば記載}
ガイド/アシスタント：{名前。なければ「連絡待ち」}
【料金】¥{金額}

（複数予約がある場合は〈予約②〉〈予約③〉...と続ける）

〈共通情報〉
お客様名：
{お客様名1}
{お客様名2がいれば記載}


【貴社予約番号】{予約コード}

緊急：
（お客様名）：{お客様の電話番号。あれば記載}
（ガイド/アシスタント）：{同行する場合は必須。連絡先}
（手配担当者様）：{担当者名・電話番号}　※必須
（依頼会社）：{会社名・固定電話番号}　※必須
___________________________________________

【ルール】
- 情報が見つからない項目は「未定」または「連絡待ち」と記載
- 複数日程の予約がある場合は、予約①②③...と分けて整形
- メール内の最新情報を優先（変更・キャンセルがあれば反映）
- 日本語で出力
- 罫線を正確に使用
- エスコートとミートサービスは別物。混同しないこと
- ガイドとアシスタントは同じ意味（名称が違うだけ）
- ガイド/アシスタントの連絡先とドライバーの連絡先を混同しないこと
- 電話番号は必ず手配担当者と依頼会社の分が必要。ガイド/アシスタント同行時はその分も必須`;

// System prompt for Excel JSON extraction
const EXCEL_SYSTEM_PROMPT = `あなたは木の子交通株式会社の予約データ抽出アシスタントです。
以下のメール・やり取り内容から予約情報を抽出し、JSON形式で返してください。

【出力形式】必ず以下のJSON形式のみを出力（説明テキスト不要）：
{
  "reservations": [
    {
      "利用日": "2026年5月11日",
      "乗務員": "",
      "車両番号": "",
      "エージェント": "エージェント名",
      "お客様名前": "お客様名",
      "配車時間": "14:20",
      "予約状態": "開始前",
      "支払い状況": "",
      "支払い方法": "",
      "乗車地": "乗車場所",
      "下車地": "下車場所",
      "フライト情報": "便名",
      "グループ番号": "",
      "配車番号": "",
      "予約番号": "予約コード",
      "プラン": "プラン名",
      "車種指定料": "",
      "料金": "17000",
      "延長料金": "",
      "ミートサービス料": "",
      "お茶代": "",
      "言語指定": "",
      "オプション": "",
      "詳細オプション": "",
      "請求料金": "17000"
    }
  ]
}

【ルール】
- 複数予約がある場合はreservations配列に複数オブジェクトを入れる
- 情報が見つからない項目は空文字""とする
- 料金は数値のみ（¥やカンマなし）
- 日付は「yyyy年m月d日」形式
- 時間は「HH:MM」形式
- JSONのみを出力し、他のテキストは一切含めない`;

// Excel column headers
const EXCEL_HEADERS = [
  '利用日', '乗務員', '車両番号', 'エージェント', 'お客様名前',
  '配車時間', '予約状態', '支払い状況', '支払い方法', '乗車地',
  '下車地', 'フライト情報', 'グループ番号', '配車番号', '予約番号',
  'プラン', '車種指定料', '料金', '延長料金', 'ミートサービス料',
  'お茶代', '言語指定', 'オプション', '詳細オプション', '請求料金'
];

// State
let isProcessing = false;
let lastExcelWorkbook = null;
let lastExcelFilename = '予約一覧.xlsx';

// Init
document.addEventListener('DOMContentLoaded', () => {
  updateApiStatus();
  if (!getApiKey()) {
    document.getElementById('setupModal').classList.add('visible');
  }
  setupDropZone();
});

// API Key Management
function getApiKey() {
  return localStorage.getItem(STORAGE_KEY);
}

function updateApiStatus() {
  const el = document.getElementById('apiStatus');
  if (getApiKey()) {
    el.textContent = 'APIキー設定済み';
    el.className = 'api-status connected';
  } else {
    el.textContent = 'APIキー未設定';
    el.className = 'api-status disconnected';
  }
}

function openSettings() {
  const modal = document.getElementById('settingsModal');
  const input = document.getElementById('apiKeyInput');
  const deleteBtn = document.getElementById('deleteKeyBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  
  input.value = getApiKey() || '';
  deleteBtn.style.display = getApiKey() ? 'inline-block' : 'none';
  cancelBtn.style.display = 'inline-block';
  modal.classList.add('visible');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('visible');
}

function saveKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    showError('APIキーを入力してください');
    return;
  }
  localStorage.setItem(STORAGE_KEY, key);
  updateApiStatus();
  closeSettings();
}

function deleteKey() {
  if (confirm('APIキーを削除しますか？')) {
    localStorage.removeItem(STORAGE_KEY);
    updateApiStatus();
    closeSettings();
  }
}

function saveSetupKey() {
  const key = document.getElementById('setupKeyInput').value.trim();
  if (!key) {
    showError('APIキーを入力してください');
    return;
  }
  localStorage.setItem(STORAGE_KEY, key);
  updateApiStatus();
  document.getElementById('setupModal').classList.remove('visible');
}

// PDF Drop Zone
function setupDropZone() {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') {
      extractPdfText(file);
    } else {
      showError('PDFファイルのみ対応しています');
    }
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      extractPdfText(file);
    }
  });
}

async function extractPdfText(file) {
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = '';
    
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(' ');
      text += pageText + '\n';
    }
    
    const textarea = document.getElementById('inputText');
    textarea.value = text.trim();
    textarea.focus();
  } catch (err) {
    showError('PDFの読み取りに失敗しました: ' + err.message);
  }
}

// Call OpenAI API
async function callOpenAI(systemPrompt, userContent) {
  const apiKey = getApiKey();
  if (!apiKey) {
    openSettings();
    throw new Error('APIキーが設定されていません');
  }

  const response = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      temperature: 0.1,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userContent }
      ]
    })
  });

  if (!response.ok) {
    const errData = await response.json().catch(() => ({}));
    if (response.status === 401) {
      throw new Error('APIキーが無効です。設定を確認してください。');
    } else if (response.status === 429) {
      throw new Error('APIレート制限に達しました。少し待ってから再試行してください。');
    } else {
      throw new Error(errData.error?.message || `APIエラー (${response.status})`);
    }
  }

  const data = await response.json();
  const result = data.choices[0]?.message?.content;

  if (!result) {
    throw new Error('AIからの応答が空でした');
  }

  return result;
}

// Feature 1: Text Generation
async function generateText() {
  if (isProcessing) return;

  const inputText = document.getElementById('inputText').value.trim();
  if (!inputText) {
    showError('テキストを入力してください');
    return;
  }

  hideError();
  setButtonLoading('textGenBtn', true);

  try {
    const result = await callOpenAI(TEXT_SYSTEM_PROMPT, inputText);
    showTextOutput(result);
  } catch (err) {
    showError(err.message);
  } finally {
    setButtonLoading('textGenBtn', false);
  }
}

// Feature 2: Excel Generation
async function generateExcel() {
  if (isProcessing) return;

  const inputText = document.getElementById('inputText').value.trim();
  if (!inputText) {
    showError('テキストを入力してください');
    return;
  }

  hideError();
  setButtonLoading('excelBtn', true);

  try {
    const result = await callOpenAI(EXCEL_SYSTEM_PROMPT, inputText);
    
    // Parse JSON from AI response
    let jsonData;
    try {
      // Try to extract JSON from possible markdown code blocks
      let jsonStr = result.trim();
      if (jsonStr.startsWith('```')) {
        jsonStr = jsonStr.replace(/^```(?:json)?\s*\n?/, '').replace(/\n?```\s*$/, '');
      }
      jsonData = JSON.parse(jsonStr);
    } catch (parseErr) {
      throw new Error('AIの応答をJSONとして解析できませんでした。もう一度お試しください。');
    }

    if (!jsonData.reservations || !Array.isArray(jsonData.reservations) || jsonData.reservations.length === 0) {
      throw new Error('予約データが見つかりませんでした。');
    }

    // Build Excel workbook
    buildExcelWorkbook(jsonData);
    
    // Show preview
    showExcelOutput(jsonData);
  } catch (err) {
    showError(err.message);
  } finally {
    setButtonLoading('excelBtn', false);
  }
}

function buildExcelWorkbook(jsonData) {
  const reservations = jsonData.reservations;
  
  // Determine sheet name from agent name or default
  let sheetName = '予約一覧';
  if (reservations[0] && reservations[0]['エージェント']) {
    const agentName = reservations[0]['エージェント'].trim();
    if (agentName && agentName.length <= 31) {
      sheetName = agentName;
    }
  }
  lastExcelFilename = sheetName + '.xlsx';

  // Create worksheet data
  const wsData = [EXCEL_HEADERS];
  
  reservations.forEach(res => {
    const row = EXCEL_HEADERS.map(h => res[h] || '');
    wsData.push(row);
  });

  // Create workbook
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // Column widths
  const colWidths = [
    14, 10, 10, 16, 16,
    10, 10, 10, 10, 20,
    20, 14, 10, 10, 14,
    14, 10, 10, 10, 12,
    8, 10, 14, 16, 10
  ];
  ws['!cols'] = colWidths.map(w => ({ wch: w }));

  // Auto filter on header row
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: 0, c: 24 } }) };

  // Apply styles
  const headerStyle = {
    font: { name: 'Calibri', sz: 11, bold: true },
    alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
    border: {
      top: { style: 'thin' },
      bottom: { style: 'thin' },
      left: { style: 'thin' },
      right: { style: 'thin' }
    },
    fill: { fgColor: { rgb: 'D9E1F2' } }
  };

  const dataStyle = {
    font: { name: 'Calibri', sz: 11 },
    alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
    border: {
      top: { style: 'thin' },
      bottom: { style: 'thin' },
      left: { style: 'thin' },
      right: { style: 'thin' }
    },
    fill: { fgColor: { rgb: 'F5F5F5' } }
  };

  // Apply styles to cells
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let r = range.s.r; r <= range.e.r; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cellRef = XLSX.utils.encode_cell({ r, c });
      if (!ws[cellRef]) ws[cellRef] = { v: '', t: 's' };
      ws[cellRef].s = r === 0 ? headerStyle : dataStyle;
    }
  }

  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  lastExcelWorkbook = wb;
}

function downloadExcel() {
  if (!lastExcelWorkbook) return;
  XLSX.writeFile(lastExcelWorkbook, lastExcelFilename);
}

// UI Helpers
function setButtonLoading(btnId, loading) {
  isProcessing = loading;
  const btn = document.getElementById(btnId);
  const otherBtnId = btnId === 'textGenBtn' ? 'excelBtn' : 'textGenBtn';
  const otherBtn = document.getElementById(otherBtnId);
  
  btn.disabled = loading;
  btn.classList.toggle('loading', loading);
  otherBtn.disabled = loading;
}

function showTextOutput(text) {
  const section = document.getElementById('textOutputSection');
  const box = document.getElementById('textOutputBox');
  box.textContent = text;
  section.classList.add('visible');
  // Hide excel output if visible
  document.getElementById('excelOutputSection').classList.remove('visible');
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showExcelOutput(jsonData) {
  const section = document.getElementById('excelOutputSection');
  const box = document.getElementById('excelOutputBox');
  
  const count = jsonData.reservations.length;
  let preview = `✅ ${count}件の予約データを抽出しました\n\n`;
  preview += `ファイル名: ${lastExcelFilename}\n`;
  preview += `─────────────────────────────────\n\n`;
  
  jsonData.reservations.forEach((res, i) => {
    preview += `【予約${i + 1}】\n`;
    preview += `  利用日: ${res['利用日'] || '未定'}\n`;
    preview += `  お客様: ${res['お客様名前'] || '未定'}\n`;
    preview += `  乗車地: ${res['乗車地'] || '未定'}\n`;
    preview += `  下車地: ${res['下車地'] || '未定'}\n`;
    preview += `  料金: ${res['料金'] ? '¥' + Number(res['料金']).toLocaleString() : '未定'}\n`;
    if (i < jsonData.reservations.length - 1) preview += '\n';
  });
  
  box.textContent = preview;
  section.classList.add('visible');
  // Hide text output if visible
  document.getElementById('textOutputSection').classList.remove('visible');
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyOutput() {
  const box = document.getElementById('textOutputBox');
  const btn = document.getElementById('copyBtn');
  
  navigator.clipboard.writeText(box.textContent).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> コピー完了`;
    
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> コピー`;
    }, 2000);
  });
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('visible');
}
</script>
